<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КОДЕКС — АРХИВ ОРДЕНА ВОЛЬНЫХ ДЖЕДАЕВ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020610">
<style>
:root{--bg:#020610;--panel:#061224;--holo:#4fc3f7;--holo2:#81d4fa;--dim:#1b4a6b;--warn:#ffb74d;--err:#ef5350;--ok:#69f0ae}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--holo);font-family:"Consolas","Courier New",monospace;min-height:100vh;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(79,195,247,.03) 2px 4px);pointer-events:none;z-index:99}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{text-align:center;font-size:clamp(15px,4vw,26px);letter-spacing:4px;text-shadow:0 0 12px var(--holo);padding:18px 0 4px}
.sub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:18px}
.panel{background:var(--panel);border:1px solid var(--dim);border-radius:6px;padding:16px;margin-bottom:14px;box-shadow:0 0 18px rgba(79,195,247,.12) inset}
input,textarea,select{width:100%;background:#03101f;border:1px solid var(--dim);color:var(--holo2);font-family:inherit;font-size:15px;padding:10px;border-radius:4px;margin:6px 0}
input:focus,textarea:focus{outline:none;border-color:var(--holo);box-shadow:0 0 8px rgba(79,195,247,.4)}
textarea{min-height:140px;resize:vertical}
button{background:transparent;border:1px solid var(--holo);color:var(--holo);font-family:inherit;font-size:14px;padding:10px 14px;border-radius:4px;cursor:pointer;margin:4px 4px 4px 0;text-shadow:0 0 6px rgba(79,195,247,.6)}
button:hover{background:rgba(79,195,247,.15);box-shadow:0 0 12px rgba(79,195,247,.5)}
button:disabled{opacity:.4;cursor:wait}
button.danger{border-color:var(--err);color:var(--err)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.msg{padding:10px;border-radius:4px;margin:8px 0;font-size:14px;display:none}
.msg.ok{display:block;color:var(--ok);border:1px solid var(--ok)}
.msg.err{display:block;color:var(--err);border:1px solid var(--err)}
.rec{border:1px solid var(--dim);border-left:3px solid var(--holo);padding:10px;margin:8px 0;border-radius:4px;cursor:pointer}
.rec:hover{background:rgba(79,195,247,.08)}
.code{color:var(--warn)}.locked{color:var(--dim)}
.meta{color:var(--dim);font-size:12px;margin:4px 0}
.body-text{white-space:normal;color:var(--holo2);line-height:1.5;padding:10px 0}
.tag{display:inline-block;border:1px solid var(--dim);border-radius:10px;padding:1px 8px;font-size:11px;margin:2px;color:var(--holo2)}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--holo2);margin-bottom:10px}
.journal-line{font-size:12px;color:var(--dim);padding:2px 0;border-bottom:1px dashed #0a2236}
.glow{animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{text-shadow:0 0 8px var(--holo)}50%{text-shadow:0 0 22px var(--holo)}}
label{font-size:12px;color:var(--dim)}
#diag{position:fixed;left:8px;right:8px;bottom:8px;max-height:130px;overflow:auto;background:#03101f;border:1px solid var(--dim);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--dim);z-index:100}
#diag b{color:var(--holo2)}
.img-preview{max-width:100%;max-height:300px;border:1px solid var(--dim);border-radius:4px;margin-top:8px;display:none}
.img-dossier{max-width:100%;border-radius:4px;border:1px solid var(--dim);margin-top:10px;display:block}
.editor-toolbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;padding:6px;background:#03101f;border:1px solid var(--dim);border-radius:4px}
.editor-toolbar button{padding:6px 10px;font-size:13px;margin:0;min-width:32px}
.editor-content{min-height:200px;background:#03101f;border:1px solid var(--dim);border-radius:4px;padding:10px;color:var(--holo2);font-family:inherit;font-size:15px;line-height:1.5;outline:none;overflow-y:auto}
.editor-content:focus{border-color:var(--holo);box-shadow:0 0 8px rgba(79,195,247,.4)}
.editor-content h1,.editor-content h2,.editor-content h3{color:var(--holo);margin:10px 0 5px}
.editor-content blockquote{border-left:3px solid var(--dim);padding-left:10px;color:var(--dim);margin:8px 0}
.editor-content ul,.editor-content ol{padding-left:20px;margin:8px 0}
.editor-content img{max-width:100%;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
<h1 class="glow">⟡ К О Д Е К С ⟡</h1>
<div class="sub">АРХИВ ОРДЕНА ВОЛЬНЫХ ДЖЕДАЕВ · «Знание — свет. Свет — Сила.»</div>

<!-- LOGIN SCREEN -->
<div id="authScreen" class="panel">
  <p>ИДЕНТИФИКАЦИЯ ОПЕРАТОРА</p>
  <input id="loginPass" type="password" placeholder="PIN-код доступа" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">ВОЙТИ В АРХИВ</button>
  <div id="authMsg" class="msg"></div>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen" class="hidden">
  <div class="topbar">
    <span>Приветствую, оператор <b>Аранэль Хальдарон</b> · МАГИСТР · допуск 5</span>
    <span><button onclick="logout()">ВЫХОД</button></span>
  </div>
  <div class="panel">
    <input id="searchBox" placeholder="🔍 Фильтр: название, тег, код…" oninput="renderList()">
    <div class="row">
      <button onclick="openEditor()">＋ НОВАЯ ЗАПИСЬ</button>
      <button onclick="showTab('list')">АРХИВ</button>
      <button onclick="showTab('cats')">КАТЕГОРИИ</button>
      <button onclick="exportData()">💾 ЭКСПОРТ</button>
      <button onclick="importData()">📂 ИМПОРТ</button>
    </div>
  </div>

  <div id="tab-list" class="panel"><div id="recList"></div></div>

  <div id="tab-view" class="panel hidden">
    <button onclick="showTab('list')">← НАЗАД</button>
    <div id="viewContent"></div>
  </div>

  <div id="tab-editor" class="panel hidden">
    <p id="editorTitle">─── НОВАЯ ЗАПИСЬ ───</p>
    <input id="edTitle" placeholder="Название записи">
    <div class="row">
      <select id="edCat"></select>
      <select id="edClear">
        <option value="1">Допуск 1 — Падаван</option>
        <option value="2">Допуск 2 — Рыцарь</option>
        <option value="3" selected>Допуск 3 — Мастер</option>
        <option value="4">Допуск 4 — Совет</option>
        <option value="5">Допуск 5 — Магистр</option>
      </select>
    </div>
    <input id="edTags" placeholder="Теги через запятую">
    <input id="edSource" placeholder="Источник / ссылка">
    <label>Текст досье:</label>
    <div class="editor-toolbar">
      <button onclick="execCmd('bold')" title="Жирный"><b>B</b></button>
      <button onclick="execCmd('italic')" title="Курсив"><i>I</i></button>
      <button onclick="execCmd('underline')" title="Подчёркнутый"><u>U</u></button>
      <button onclick="execCmd('formatBlock','H2')" title="Заголовок">H2</button>
      <button onclick="execCmd('insertUnorderedList')" title="Список">• List</button>
      <button onclick="execCmd('formatBlock','BLOCKQUOTE')" title="Цитата">❝</button>
      <button onclick="execCmd('justifyCenter')" title="По центру">⫿</button>
    </div>
    <div id="edBody" class="editor-content" contenteditable="true"></div>
    <label>Фото (выбери файл):</label>
    <input type="file" id="edFile" accept="image/*">
    <img id="imgPreview" class="img-preview">
    <button onclick="saveRecord()">💾 СОХРАНИТЬ</button>
    <button onclick="showTab('list')">ОТМЕНА</button>
    <div id="edMsg" class="msg"></div>
  </div>

  <div id="tab-cats" class="panel hidden">
    <p>─── КАТЕГОРИИ ───</p><div id="catList"></div>
    <div class="row"><input id="newCatName" placeholder="Новая категория"><input id="newCatPrefix" placeholder="Префикс" maxlength="3"></div>
    <button onclick="addCategory()">ДОБАВИТЬ КАТЕГОРИЮ</button>
    <div id="catMsg" class="msg"></div>
  </div>
</div>
<div class="sub">PWA · IndexedDB · Offline-first</div>
</div>
<div id="diag"><b>ЖУРНАЛ ДИАГНОСТИКИ</b></div>

<script src="app.js"></script>
</body>
</html>
